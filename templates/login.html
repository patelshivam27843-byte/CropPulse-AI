<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CropPulse AI — किसान Login</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="auth-page"><div class="auth-card"><section class="auth-info"><a href="/" class="auth-brand">🌱 CropPulse AI</a><h1>सुरक्षित Login.<br>स्मार्ट खेती.</h1><p>मोबाइल OTP, Email या Google Account से प्रवेश करें।</p><div class="auth-points"><div>📱 मोबाइल OTP</div><div>✉️ Email Login</div><div>🔐 Google Account</div></div></section><section class="auth-box"><a class="back" href="/">← वापस</a><h2>किसान Login</h2><p>अपना तरीका चुनें</p><div class="auth-tabs"><button class="active" data-method="phone">📱 OTP</button><button data-method="email">✉️ Email</button><button data-method="google">G Google</button></div><div id="phone" class="auth-method active"><label>मोबाइल नंबर</label><input id="phone-number" type="tel" inputmode="tel" placeholder="+91 9876543210"><div id="recaptcha-container"></div><button id="send-otp" class="auth-btn">OTP भेजें</button><div id="otp-area" style="display:none"><label>OTP</label><div class="otp-row"><input id="otp-code" inputmode="numeric" maxlength="6" placeholder="6 अंकों का OTP"><button id="verify-otp" class="auth-btn">Verify</button></div></div><div id="phone-status" class="status"></div></div><div id="email" class="auth-method"><label>Email</label><input id="email-address" type="email" placeholder="farmer@example.com"><label>Password</label><input id="email-password" type="password" placeholder="कम से कम 6 अक्षर"><button id="email-login" class="auth-btn">Login</button><button id="email-signup" class="auth-btn light">नया Account बनाएँ</button><div id="email-status" class="status"></div></div><div id="google" class="auth-method"><button id="google-login" class="auth-btn google-btn">🔐 Google Account से Login</button><div id="google-status" class="status"></div></div><p class="small-note">OTP और Google Login के लिए Firebase Authentication में संबंधित providers enable करना जरूरी है।</p></section></div><script type="module" src="{{ url_for('static',filename='firebase-auth.js') }}"></script></body></html>
